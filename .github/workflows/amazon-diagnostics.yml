name: Amazon Fetch Diagnostics

on:
  workflow_dispatch:
    inputs:
      asin:
        description: '取得を確認するASIN'
        required: true
        default: B0CDWSWLWV
        type: string
      engine:
        description: 'HTML取得方法'
        required: true
        default: http
        type: choice
        options:
          - http
          - playwright
          - search
      attempts:
        description: '各runnerの取得回数（10秒間隔・毎回キャッシュなし）'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: read

concurrency:
  group: amazon-diagnostics
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch on runner ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Build diagnostic tool
        run: dotnet build tools/AmazonFetchDiagnostics/AmazonFetchDiagnostics.csproj -c Release /p:CodexSkipRelaxVersioner=true
      - name: Install Chromium
        if: inputs.engine == 'playwright'
        run: pwsh tools/AmazonFetchDiagnostics/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Record runner egress IP for comparison
        run: |
          if ! curl --fail --silent --show-error --max-time 10 https://checkip.amazonaws.com > runner-egress-ip.txt; then
            echo 'unavailable' > runner-egress-ip.txt
          fi
      - name: Fetch using production implementation
        env:
          DIAGNOSTIC_ASIN: ${{ inputs.asin }}
          DIAGNOSTIC_ATTEMPTS: ${{ inputs.attempts }}
          DIAGNOSTIC_ENGINE: ${{ inputs.engine }}
        run: >-
          dotnet tools/AmazonFetchDiagnostics/bin/Release/net10.0/AmazonFetchDiagnostics.dll
          "$DIAGNOSTIC_ASIN" "$DIAGNOSTIC_ATTEMPTS" "$DIAGNOSTIC_ENGINE"
      - name: Report diagnostic outcome
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path('amazon-diagnostics.json')
          if path.exists():
              for result in json.loads(path.read_text()):
                  message = json.dumps(result, ensure_ascii=False)
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Amazon diagnostic result::' + message)
          PYTHON
      - name: Upload results even when fetch fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-diagnostics-${{ matrix.sample }}
          path: |
            amazon-diagnostics.json
            amazon-response-*.html
            amazon-browser-*
            runner-egress-ip.txt
          if-no-files-found: warn
          retention-days: 7
