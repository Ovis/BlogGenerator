name: Publish BlogGenerator

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Extract and validate version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Pack NuGet package
        run: |
          dotnet pack ./src/BlogGenerator.csproj \
            --configuration Release \
            --output ./artifacts/nuget \
            -p:Version=${{ env.VERSION }}

      - name: Publish executable
        run: |
          dotnet publish ./src/BlogGenerator.csproj \
            --configuration Release \
            --output ./artifacts/publish \
            -p:Version=${{ env.VERSION }}

      - name: Create publish ZIP archive
        run: |
          cd ./artifacts/publish
          zip -r ../BlogGenerator-v${{ env.VERSION }}.zip .

      - name: Create template ZIP archive
        run: |
          cd ./src
          zip -r ../artifacts/BlogGenerator-TemplateSample-v${{ env.VERSION }}.zip TemplateSample

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            ./artifacts/nuget/*.nupkg
            ./artifacts/BlogGenerator-v${{ env.VERSION }}.zip
            ./artifacts/BlogGenerator-TemplateSample-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Ovis

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/nuget/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
